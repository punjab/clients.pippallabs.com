databases:
  - name: pippal-crm-postgres
    plan: basic-256mb
    databaseName: pippal_crm
    user: pippal_crm

services:
  - type: web
    name: pippal-crm-web
    runtime: docker
    plan: starter
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    preDeployCommand: bin/rails db:migrate
    envVars: &application_env
      - key: DATABASE_URL
        fromDatabase:
          name: pippal-crm-postgres
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: APP_HOST
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_ADDRESS
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

  - type: worker
    name: pippal-crm-jobs
    runtime: docker
    plan: starter
    dockerCommand: bin/jobs
    autoDeployTrigger: checksPass
    envVars: *application_env
